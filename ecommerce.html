<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Shop</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; text-align: center; margin: 0; padding: 20px; }
        header { background: #168bd1; color: white; padding: 20px; border-radius: 8px; }
        .products { display: flex; justify-content: center; gap: 20px; margin-top: 30px; flex-wrap: wrap; }
        .card { background: white; padding: 15px; border-radius: 8px; width: 220px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 6px; }
        .card button { background: #168bd1; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; margin-top: 10px; width: 100%; }
        .card button:hover { background: #0e6ca8; }
    </style>
</head>
<body>
    <header>
        <h1>Tech Shop Mini E-Commerce</h1>
    </header>
    <div class="products">
        <div class="card">
            <img src="../images/headphones.jpg" alt="Headphones">
            <h3>Headphones</h3>
            <p>₹1,499</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <img src="../images/smartwatch.jpg" alt="Smart Watch">
            <h3>Smart Watch</h3>
            <p>₹2,999</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <img src="../images/mobilephone.jpg" alt="mobilephone">
            <h3>Mouse</h3>
            <p>₹799</p>
            <button>Buy Now</button>
        </div>
    </div>
</body>
</html>
